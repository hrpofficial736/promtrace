name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      - name: build binary
        shell: bash
        run: |
          set -e
          mkdir -p dist
          ext=""
          if [ "${{ matrix.goos }}" == "windows" ]; then
            ext=".exe"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=1 \
          go build -o "dist/promtrace-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/promtrace

      - uses: actions/upload-artifact@v4
        with:
          name: promtrace-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/


  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: create checksum file
        run: sha256 release/** > release/checksums.txt

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
